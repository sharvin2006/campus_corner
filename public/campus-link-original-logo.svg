<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background clean white card with subtle radial depth -->
    <radialGradient id="cardBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="70%" stopColor="#FAFCFF" />
      <stop offset="100%" stopColor="#F0F4FA" />
    </radialGradient>

    <!-- Outer 'C' gradient matching Picture11.png exactly -->
    <linearGradient id="origCGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stopColor="#00A3FF" />
      <stop offset="35%" stopColor="#0066EE" />
      <stop offset="70%" stopColor="#0037B3" />
      <stop offset="100%" stopColor="#001F7A" />
    </linearGradient>

    <!-- Inner 'L' gradient -->
    <linearGradient id="origLGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0088FF" />
      <stop offset="50%" stopColor="#004EC2" />
      <stop offset="100%" stopColor="#00298A" />
    </linearGradient>

    <!-- Connected link loop gradient -->
    <linearGradient id="origLinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00D2FF" />
      <stop offset="50%" stopColor="#0088FF" />
      <stop offset="100%" stopColor="#004ED4" />
    </linearGradient>

    <!-- Brand text gradient for 'LINK' -->
    <linearGradient id="linkTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0077EE" />
      <stop offset="100%" stopColor="#00C4FF" />
    </linearGradient>

    <!-- Soft drop shadow under emblem -->
    <filter id="origEmblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0044BB" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <filter id="loopGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean card background -->
  <rect width="500" height="500" fill="url(#cardBg)" />

  <!-- 1. Emblem Group (Scaled & Centered in top half) -->
  <g transform="translate(250, 190) scale(1.4) translate(-100, -100)" filter="url(#origEmblemShadow)">
    <!-- Outer Sweeping 'C' Ring -->
    <path
      d="M 100 22 C 57 22 22 57 22 100 C 22 143 57 178 100 178 C 131 178 158 160 171 133 L 148 122 C 139 141 121 154 100 154 C 70 154 46 130 46 100 C 46 70 70 46 100 46 C 122 46 141 59 150 79 L 173 68 C 160 41 132 22 100 22 Z"
      fill="url(#origCGrad)"
    />

    <!-- Inner Bold Letter 'L' -->
    <path
      d="M 85 54 L 105 54 L 105 130 L 142 130 C 146 130 148 133 148 136 C 148 140 146 148 138 148 L 85 148 Z"
      fill="url(#origLGrad)"
    />

    <!-- Pixel Matrix blocks emerging from top right of the 'L' -->
    <rect x="146" y="44" width="9" height="9" fill="#00B4FF" />
    <rect x="158" y="44" width="9" height="9" fill="#0084FF" />
    <rect x="158" y="56" width="9" height="9" fill="#00A8FF" />
    <rect x="170" y="56" width="9" height="9" fill="#00E5FF" />
    <rect x="170" y="68" width="9" height="9" fill="#0084FF" />
    <rect x="146" y="68" width="9" height="9" fill="#005CE6" />
    <rect x="134" y="56" width="8" height="8" fill="#0094FF" />
    <rect x="122" y="68" width="8" height="8" fill="#00B4FF" />
    <rect x="122" y="80" width="8" height="8" fill="#005CE6" />

    <!-- Connected horizontal chain loop linking out of L -->
    <rect
      x="116"
      y="114"
      width="48"
      height="28"
      rx="14"
      stroke="url(#origLinkGrad)"
      stroke-width="9"
      fill="none"
      filter="url(#loopGlow)"
    />
    <!-- Center Cyan Core Dot -->
    <circle cx="140" cy="128" r="4.5" fill="#00E5FF" />
  </g>

  <!-- 2. Typography from Picture11.png -->
  <g transform="translate(250, 355)" text-anchor="middle">
    <!-- CAMPUS LINK with stylized 'A' cut -->
    <text font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="3">
      <tspan fill="#0B1C3D">C</tspan>
      <tspan fill="#0B1C3D">A</tspan>
      <tspan fill="#0B1C3D">MPUS </tspan>
      <tspan fill="url(#linkTextGrad)">LINK</tspan>
    </text>

    <!-- Subtitle: TECHNOLOGIES with flanking horizontal accent rules -->
    <g transform="translate(0, 34)">
      <!-- Left line -->
      <line x1="-210" y1="-5" x2="-115" y2="-5" stroke="#0077EE" stroke-width="2.5" stroke-linecap="round" />
      <text fill="#0B1C3D" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-weight="800" font-size="16" letter-spacing="8" y="0">
        TECHNOLOGIES
      </text>
      <!-- Right line -->
      <line x1="115" y1="-5" x2="210" y2="-5" stroke="#0077EE" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- SDN. BHD. -->
    <text y="64" fill="#0077EE" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-weight="700" font-size="12" letter-spacing="4">
      SDN. BHD
    </text>
  </g>
</svg>
