<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient matching original app dark navy palette -->
    <radialGradient id="maskableBgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stopColor="#10254C" />
      <stop offset="60%" stopColor="#0B152E" />
      <stop offset="100%" stopColor="#070C1B" />
    </radialGradient>

    <!-- Outer 'C' gradient matching Campus Link emblem -->
    <linearGradient id="maskableCGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stopColor="#00A3FF" />
      <stop offset="35%" stopColor="#0066EE" />
      <stop offset="70%" stopColor="#0044CC" />
      <stop offset="100%" stopColor="#002B88" />
    </linearGradient>

    <!-- Inner 'L' gradient -->
    <linearGradient id="maskableLGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0088FF" />
      <stop offset="60%" stopColor="#0055DD" />
      <stop offset="100%" stopColor="#003399" />
    </linearGradient>

    <!-- Connecting link loop gradient -->
    <linearGradient id="maskableLinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00DDFF" />
      <stop offset="50%" stopColor="#0099FF" />
      <stop offset="100%" stopColor="#0055EE" />
    </linearGradient>

    <filter id="maskableShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0066FF" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="maskableSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full bleed background covering 100% of canvas with zero border radius for Android adaptive shape cropping -->
  <rect width="512" height="512" fill="url(#maskableBgGlow)" />

  <!-- Logo Group centered inside Android Safe Zone (66% safe diameter: 85 to 427) -->
  <g transform="translate(256, 256) scale(1.42) translate(-100, -100)" filter="url(#maskableShadow)">
    <!-- Outer Sweeping 'C' Ring -->
    <path
      d="M 100 22 C 57 22 22 57 22 100 C 22 143 57 178 100 178 C 131 178 158 160 171 133 L 148 122 C 139 141 121 154 100 154 C 70 154 46 130 46 100 C 46 70 70 46 100 46 C 122 46 141 59 150 79 L 173 68 C 160 41 132 22 100 22 Z"
      fill="url(#maskableCGrad)"
    />

    <!-- Inner Bold Letter 'L' -->
    <path
      d="M 85 54 L 105 54 L 105 130 L 142 130 C 146 130 148 133 148 136 C 148 140 146 148 138 148 L 85 148 Z"
      fill="url(#maskableLGrad)"
    />

    <!-- Floating Pixel Matrix blocks extending outward from upper-right of the 'L' -->
    <rect x="146" y="44" width="9" height="9" fill="#00B4FF" />
    <rect x="158" y="44" width="9" height="9" fill="#0084FF" />
    <rect x="158" y="56" width="9" height="9" fill="#00A8FF" />
    <rect x="170" y="56" width="9" height="9" fill="#00E5FF" />
    <rect x="170" y="68" width="9" height="9" fill="#0084FF" />
    <rect x="146" y="68" width="9" height="9" fill="#005CE6" />
    <rect x="134" y="56" width="8" height="8" fill="#0094FF" />
    <rect x="122" y="68" width="8" height="8" fill="#00B4FF" />
    <rect x="122" y="80" width="8" height="8" fill="#005CE6" />

    <!-- Connected Horizontal Link Loop emerging from bottom of 'L' -->
    <rect
      x="116"
      y="114"
      width="48"
      height="28"
      rx="14"
      stroke="url(#maskableLinkGrad)"
      stroke-width="9"
      fill="none"
      filter="url(#maskableSoftGlow)"
    />
    <!-- Center Cyan Core Dot -->
    <circle cx="140" cy="128" r="4.5" fill="#00E5FF" />
  </g>
</svg>
